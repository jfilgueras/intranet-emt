<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMT Tarragona - Intranet</title>
    
    <!-- Firebase v9 (formato compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo img {
            max-width: 180px;
            height: auto;
        }
        
        h1 {
            color: #dc2626;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #6b7280;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #dc2626;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 10px;
        }
        
        button:hover {
            background: #b91c1c;
        }
        
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .btn-google {
            background: #4285f4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-google:hover {
            background: #357ae8;
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #6b7280;
            font-size: 14px;
            position: relative;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #e5e7eb;
        }
        
        .divider::before {
            left: 0;
        }
        
        .divider::after {
            right: 0;
        }
        
        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .loading {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="logo-emt.png" alt="EMT Tarragona">
        </div>
        
        <h1>Intranet de Personal</h1>
        <p class="subtitle">Gestión de permisos, vacaciones y servicios</p>
        
        <div id="errorMsg" class="error"></div>
        
        <div id="loginForm">
            <div class="form-group">
                <label for="email">Correu electrònic</label>
                <input type="email" id="email" placeholder="nom@emttarragona.cat" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contrasenya</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button onclick="login()" id="btnLogin">Accedir</button>
            
            <div class="divider">o</div>
            
            <button onclick="loginGoogle()" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="white" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="white" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="white" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="white" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Accedir amb Google
            </button>
        </div>
        
        <div id="loading" class="loading hidden">
            Carregant...
        </div>
    </div>

    <script>
        // CONFIGURACIÓN FIREBASE - EMT INTRANET
        const firebaseConfig = {
            apiKey: "AIzaSyAgydw6LkHb0QkIR3aZDSmcsGFDfDFX4rM",
            authDomain: "emt-intranet.firebaseapp.com",
            projectId: "emt-intranet",
            storageBucket: "emt-intranet.firebasestorage.app",
            messagingSenderId: "791189451295",
            appId: "1:791189451295:web:a2b681f36d0a65b831b2a"
        };
        
        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // Mostrar error
        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        // Login con Email/Password
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btnLogin');
            
            if (!email || !password) {
                showError('Si us plau, introdueix email i contrasenya');
                return;
            }
            
            btnLogin.disabled = true;
            btnLogin.textContent = 'Accedint...';
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                const userDoc = await db.collection('usuarios').doc(user.uid).get();
                
                if (!userDoc.exists) {
                    await auth.signOut();
                    showError('Usuari no trobat a la base de dades. Contacta amb administració.');
                    return;
                }
                
                const userData = userDoc.data();
                
                sessionStorage.setItem('userUID', user.uid);
                sessionStorage.setItem('userName', userData.nombre);
                sessionStorage.setItem('userRol', userData.rol);
                sessionStorage.setItem('userEmail', userData.email);
                
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                console.error('Error:', error);
                let mensaje = 'Error d\'autenticació';
                
                switch(error.code) {
                    case 'auth/user-not-found':
                        mensaje = 'Usuari no trobat';
                        break;
                    case 'auth/wrong-password':
                        mensaje = 'Contrasenya incorrecta';
                        break;
                    case 'auth/invalid-email':
                        mensaje = 'Email invàlid';
                        break;
                    case 'auth/too-many-requests':
                        mensaje = 'Massa intents. Torna-ho a provar més tard';
                        break;
                }
                
                showError(mensaje);
                btnLogin.disabled = false;
                btnLogin.textContent = 'Accedir';
            }
        }
        
        // Login con Google
        async function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            
            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                const userDoc = await db.collection('usuarios').doc(user.uid).get();
                
                if (!userDoc.exists) {
                    await db.collection('usuarios').doc(user.uid).set({
                        nombre: user.displayName,
                        email: user.email,
                        rol: 'conductor',
                        numeroPersonal: '',
                        activo: true,
                        fechaCreacion: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    sessionStorage.setItem('userUID', user.uid);
                    sessionStorage.setItem('userName', user.displayName);
                    sessionStorage.setItem('userRol', 'conductor');
                    sessionStorage.setItem('userEmail', user.email);
                    
                    window.location.href = 'dashboard.html';
                } else {
                    const userData = userDoc.data();
                    
                    sessionStorage.setItem('userUID', user.uid);
                    sessionStorage.setItem('userName', userData.nombre);
                    sessionStorage.setItem('userRol', userData.rol);
                    sessionStorage.setItem('userEmail', userData.email);
                    
                    window.location.href = 'dashboard.html';
                }
                
            } catch (error) {
                console.error('Error:', error);
                showError('Error d\'autenticació amb Google');
            }
        }
        
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
        
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userDoc = await db.collection('usuarios').doc(user.uid).get();
                
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    sessionStorage.setItem('userUID', user.uid);
                    sessionStorage.setItem('userName', userData.nombre);
                    sessionStorage.setItem('userRol', userData.rol);
                    sessionStorage.setItem('userEmail', userData.email);
                    window.location.href = 'dashboard.html';
                }
            }
        });
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>
</html>
